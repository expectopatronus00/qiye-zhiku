# 企业智库 RAG 配置模板
# 复制为 config.yaml 后修改

# 服务配置
server:
  host: "0.0.0.0"
  port: 8000
  debug: false
  # HTTPS 一键启用（v1.4 等保）：配置证书路径后服务以 HTTPS 运行
  # 自签证书生成：python scripts/gen_self_signed_cert.py（生产建议使用 CA 签发证书）
  ssl_certfile: ""   # 如 ./certs/server.crt
  ssl_keyfile: ""    # 如 ./certs/server.key

# LLM 配置
llm:
  # 可选: ollama | openai | ascend | cambricon | mthreads
  #   ascend=昇腾 CANN / cambricon=寒武纪 MLU / mthreads=摩尔线程（均走 OpenAI 兼容协议）
  provider: "ollama"
  # Ollama 模型名
  model: "qwen2.5:7b"
  # Ollama 服务地址（Docker Compose 部署时改为 http://ollama:11434）
  ollama_base_url: "http://localhost:11434"
  # OpenAI 配置（provider 为 openai 时使用）
  openai_api_key: ""
  openai_base_url: "https://api.openai.com/v1"
  # 国产化推理服务地址（v1.3 信创适配，provider 为 ascend/cambricon/mthreads 时使用；
  # 留空回退 openai_base_url；内网无鉴权时 openai_api_key 留空即可）
  ascend_base_url: ""
  cambricon_base_url: ""
  mthreads_base_url: ""
  # 生成参数
  temperature: 0.3
  max_tokens: 2048

# 嵌入模型配置
embedding:
  # 可选: ollama | openai | ascend | cambricon | mthreads | local
  provider: "ollama"
  model: "nomic-embed-text"
  # OpenAI 配置（provider 为 openai 时使用）
  openai_api_key: ""
  openai_base_url: "https://api.openai.com/v1"
  # 国产化嵌入服务地址（v1.3 信创适配，如国产栈上的 bge-m3）
  ascend_base_url: ""
  cambricon_base_url: ""
  mthreads_base_url: ""
  # 本地模型路径（provider 为 local 时使用）
  local_model_path: ""

# 向量数据库配置
vectorstore:
  # 可选: chroma | milvus
  type: "chroma"
  # 持久化目录（Chroma 使用）
  persist_directory: "./data/vectorstore"
  # Milvus 服务地址（v1.3 信创适配，type 为 milvus 时使用）
  milvus_uri: "http://localhost:19530"
  # Milvus 鉴权 token（如 user:password，未开启鉴权留空）
  milvus_token: ""
  # 向量维度（需与嵌入模型匹配：nomic-embed-text=768，bge-m3=1024）
  dimension: 768

# 文档处理配置
document:
  # 分块大小（字符数）
  chunk_size: 500
  # 分块重叠（字符数）
  chunk_overlap: 50
  # 支持的文件类型
  allowed_extensions:
    - ".pdf"
    - ".docx"
    - ".xlsx"
    - ".md"
    - ".txt"
    - ".csv"
  # 上传文件存储目录
  upload_directory: "./data/uploads"
  # 大文档异步上传阈值（字节，v1.5：超过则转入后台任务队列，接口立即返回 task_id）
  async_upload_threshold: 5242880
  # ---- 文档增强 (v0.5) ----
  # PDF 版面分析: 大于等于该字号(points)的文本块判定为标题
  heading_min_size: 13.0
  # PDF 表格识别并转换为 Markdown 入库
  table_to_markdown: true
  # PDF 内嵌图片 OCR（RapidOCR，模型内置）
  ocr_enabled: true
  # 每页最多 OCR 的图片数
  ocr_max_images_per_page: 3
  # 参与 OCR 的最小图片面积(px²)，过滤小图标
  ocr_min_area: 8000

# 检索配置
retrieval:
  # 返回的文档块数量
  top_k: 5
  # 相似度阈值（0-1）
  score_threshold: 0.5
  # 是否启用混合检索（向量 + BM25）
  hybrid_search: true
  # BM25 权重（0-1，0 表示纯向量检索）
  bm25_weight: 0.3

# Query 改写配置（多轮对话追问补全）
query_rewrite:
  # 是否启用 Query 改写
  enabled: true
  # 改写时参考的最大历史轮数
  max_history_turns: 4

# 重排序配置
reranker:
  # 是否启用重排序
  enabled: true
  # 重排序方式: cross_encoder | heuristic | none
  #   cross_encoder: 本地交叉编码器模型精排（精度最高）
  #   heuristic: 零依赖启发式精排（查询词覆盖率 + 原始分数 + 位置）
  #   模型缺失或加载失败时自动降级为 heuristic
  type: "heuristic"
  # cross_encoder 模型路径（本地目录，如 BAAI/bge-reranker-base）
  model_path: ""
  # 精排后返回的条数
  top_n: 5

# 评估体系配置 (v0.6, 可选)
eval:
  # 是否启用评估（运行 scripts/run_eval.py 时生效）
  enabled: true
  # 裁判模型，空则复用 llm.model（评估全程本地完成，数据不出域）
  judge_model: ""
  # 裁判判定温度（0 保证判定一致性）
  judge_temperature: 0.0
  # 答案相关性评估时生成的问题数
  num_generated_questions: 3
  # 每次裁判判定送入的最大上下文长度
  max_context_chars: 4000
  # 评估报告输出目录
  report_directory: "./data/eval_reports"
  # 质量门禁阈值（低于任一指标则评估失败，退出码 1，供 CI 使用）
  min_faithfulness: 0.5
  min_answer_relevancy: 0.4
  min_context_recall: 0.5

# 数据目录
data:
  uploads: "./data/uploads"
  vectorstore: "./data/vectorstore"
  logs: "./data/logs"

# 安全与权限配置 (v0.7)
security:
  # 是否启用认证（false 则所有接口免登录，内网直连模式）
  auth_enabled: true
  # 登录令牌有效期（小时）
  token_expire_hours: 24
  # 用户/知识库归属/审计日志 SQLite 路径
  db_path: "./data/security.db"
  # 管理员用户名
  admin_username: "admin"
  # 管理员密码（空则首次启动生成随机密码写入 data/admin_credentials.txt）
  admin_password: ""
  # 连续失败锁定次数（0 表示不锁定）
  max_login_attempts: 5
  # ---- 数据安全 (v1.4 等保 2.0) ----
  # 敏感信息脱敏（上传入库 + 问答输出双链路；覆盖手机号/身份证/银行卡/API Key/长Token/邮箱）
  mask_sensitive: true
  # 同一用户连续登录失败达到该次数触发 security.alert 告警审计（0 关闭）
  login_alert_threshold: 3
  # 密码最小长度（等保三级 ≥8 位；同时要求大写/小写/数字/特殊字符至少 3 类、禁弱口令）
  password_min_length: 8
  # 会话共享 Redis 地址（v1.5：非空则登录会话共享到 Redis，多副本部署必配；空走 SQLite 单机模式）
  redis_url: ""

# Agent 模式配置 (v0.9)
agent:
  # 单次任务最大工具调用轮数（达上限后强制模型基于已有结果总结）
  max_iterations: 6
  # Agent 默认检索的知识库
  default_collection: "default"

# 热门问题缓存 (v1.5)
cache:
  # 是否启用问答结果缓存
  enabled: true
  # LRU 容量（问题数，超出淘汰最久未用）
  maxsize: 256
  # 缓存有效期（秒，1 小时）
  ttl_seconds: 3600

# 知识图谱 (v1.6)
graph:
  # 是否启用（上传文档时自动抽取实体/共现关系建图）
  enabled: true
  # 图谱 SQLite 路径
  db_path: "./data/graph.db"
  # 扩展领域词典（追加到内置信创 GPU/厂商词表：昇腾/寒武纪/摩尔线程/海光/飞腾/鲲鹏/龙芯/兆芯/昆仑/Atlas 等）
  entity_dict: []
  # 单库实体上限（防无限膨胀）
  max_entities: 200
  # 图谱问答增强：实体命中时按实体名额外检索的块数
  qa_context_topk: 3

# 多模态 VLM 图表理解 (v1.6 信创路线)
vision:
  # 是否启用（未配置 VLM 时自动降级纯 OCR，不影响入库）
  enabled: true
  # OpenAI 兼容 VLM 端点（昇腾 CANN vLLM-Ascend/寒武纪/摩尔线程部署 Qwen2.5-VL 等时填写；
  # 空则图表图片仅走 RapidOCR 文本识别）
  base_url: ""
  # VLM 模型名
  model: "qwen2.5-vl:7b"
  # API Key（内网无鉴权服务留空）
  api_key: ""
  # OCR 文本少于该字符数视为图表 → 调用 VLM 生成中文描述
  min_text_chars: 30
  # 送 VLM 的图片大小上限（超过仅 OCR，防超大图拖慢入库）
  max_image_bytes: 2097152

# Webhook 通知 (v1.6)
webhook:
  # 总开关
  enabled: true
  # 飞书自定义机器人 URL（多个逗号分隔；留空不推送）
  feishu_urls: ""
  # 钉钉自定义机器人 URL（多个逗号分隔；留空不推送）
  dingtalk_urls: ""
  # 事件开关：文档上传完成 / 后台任务失败 / 安全告警 / 用户反馈
  notify_upload: true
  notify_task_failed: true
  notify_security_alert: true
  notify_feedback: true
