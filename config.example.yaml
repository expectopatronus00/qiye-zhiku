# 企业智库 RAG 配置模板
# 复制为 config.yaml 后修改

# 服务配置
server:
  host: "0.0.0.0"
  port: 8000
  debug: false

# LLM 配置
llm:
  # 可选: ollama | openai
  provider: "ollama"
  # Ollama 模型名
  model: "qwen2.5:7b"
  # Ollama 服务地址（Docker Compose 部署时改为 http://ollama:11434）
  ollama_base_url: "http://localhost:11434"
  # OpenAI 配置（provider 为 openai 时使用）
  openai_api_key: ""
  openai_base_url: "https://api.openai.com/v1"
  # 生成参数
  temperature: 0.3
  max_tokens: 2048

# 嵌入模型配置
embedding:
  # 可选: ollama | openai | local
  provider: "ollama"
  model: "nomic-embed-text"
  # OpenAI 配置（provider 为 openai 时使用）
  openai_api_key: ""
  openai_base_url: "https://api.openai.com/v1"
  # 本地模型路径（provider 为 local 时使用）
  local_model_path: ""

# 向量数据库配置
vectorstore:
  # 可选: chroma | faiss
  type: "chroma"
  # 持久化目录
  persist_directory: "./data/vectorstore"
  # 向量维度（需与嵌入模型匹配）
  dimension: 768

# 文档处理配置
document:
  # 分块大小（字符数）
  chunk_size: 500
  # 分块重叠（字符数）
  chunk_overlap: 50
  # 支持的文件类型
  allowed_extensions:
    - ".pdf"
    - ".docx"
    - ".xlsx"
    - ".md"
    - ".txt"
    - ".csv"
  # 上传文件存储目录
  upload_directory: "./data/uploads"
  # ---- 文档增强 (v0.5) ----
  # PDF 版面分析: 大于等于该字号(points)的文本块判定为标题
  heading_min_size: 13.0
  # PDF 表格识别并转换为 Markdown 入库
  table_to_markdown: true
  # PDF 内嵌图片 OCR（RapidOCR，模型内置）
  ocr_enabled: true
  # 每页最多 OCR 的图片数
  ocr_max_images_per_page: 3
  # 参与 OCR 的最小图片面积(px²)，过滤小图标
  ocr_min_area: 8000

# 检索配置
retrieval:
  # 返回的文档块数量
  top_k: 5
  # 相似度阈值（0-1）
  score_threshold: 0.5
  # 是否启用混合检索（向量 + BM25）
  hybrid_search: true
  # BM25 权重（0-1，0 表示纯向量检索）
  bm25_weight: 0.3

# Query 改写配置（多轮对话追问补全）
query_rewrite:
  # 是否启用 Query 改写
  enabled: true
  # 改写时参考的最大历史轮数
  max_history_turns: 4

# 重排序配置
reranker:
  # 是否启用重排序
  enabled: true
  # 重排序方式: cross_encoder | heuristic | none
  #   cross_encoder: 本地交叉编码器模型精排（精度最高）
  #   heuristic: 零依赖启发式精排（查询词覆盖率 + 原始分数 + 位置）
  #   模型缺失或加载失败时自动降级为 heuristic
  type: "heuristic"
  # cross_encoder 模型路径（本地目录，如 BAAI/bge-reranker-base）
  model_path: ""
  # 精排后返回的条数
  top_n: 5

# 评估体系配置 (v0.6, 可选)
eval:
  # 是否启用评估（运行 scripts/run_eval.py 时生效）
  enabled: true
  # 裁判模型，空则复用 llm.model（评估全程本地完成，数据不出域）
  judge_model: ""
  # 裁判判定温度（0 保证判定一致性）
  judge_temperature: 0.0
  # 答案相关性评估时生成的问题数
  num_generated_questions: 3
  # 每次裁判判定送入的最大上下文长度
  max_context_chars: 4000
  # 评估报告输出目录
  report_directory: "./data/eval_reports"
  # 质量门禁阈值（低于任一指标则评估失败，退出码 1，供 CI 使用）
  min_faithfulness: 0.5
  min_answer_relevancy: 0.4
  min_context_recall: 0.5

# 数据目录
data:
  uploads: "./data/uploads"
  vectorstore: "./data/vectorstore"
  logs: "./data/logs"

# 安全与权限配置 (v0.7)
security:
  # 是否启用认证（false 则所有接口免登录，内网直连模式）
  auth_enabled: true
  # 登录令牌有效期（小时）
  token_expire_hours: 24
  # 用户/知识库归属/审计日志 SQLite 路径
  db_path: "./data/security.db"
  # 管理员用户名
  admin_username: "admin"
  # 管理员密码（空则首次启动生成随机密码写入 data/admin_credentials.txt）
  admin_password: ""
  # 连续失败锁定次数（0 表示不锁定）
  max_login_attempts: 5

# Agent 模式配置 (v0.9)
agent:
  # 单次任务最大工具调用轮数（达上限后强制模型基于已有结果总结）
  max_iterations: 6
  # Agent 默认检索的知识库
  default_collection: "default"
