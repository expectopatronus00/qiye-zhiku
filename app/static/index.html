<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业智库 - RAG 知识问答系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app" id="app-main" style="display:none;">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>企业智库</h1>
                <span class="version">v0.7</span>
            </div>

            <!-- 用户信息 -->
            <div class="user-box" id="user-box">
                <div class="user-avatar" id="user-avatar">管</div>
                <div class="user-info">
                    <span class="user-name" id="user-name">管理员</span>
                    <span class="user-role" id="user-role">admin</span>
                </div>
                <button class="btn-logout" onclick="logout()" title="退出登录">退出</button>
            </div>

            <!-- 对话列表 -->
            <div class="sidebar-section">
                <div class="section-header">
                    <h3>对话记录</h3>
                    <button onclick="newConversation()" class="btn-new-conv" title="新建对话">+</button>
                </div>
                <div id="conversation-list" class="conversation-list">
                    <!-- 动态渲染 -->
                </div>
            </div>

            <div class="sidebar-section">
                <h3>知识库</h3>
                <select id="collection-select" class="select-input">
                    <option value="default">默认知识库</option>
                </select>
                <div class="kb-actions">
                    <button onclick="createCollection()" class="btn btn-small">+ 新建</button>
                    <button onclick="deleteCollection()" class="btn btn-small btn-danger" title="删除当前知识库（属主/管理员）">删除</button>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>上传文档</h3>
                <div class="upload-area" id="upload-area">
                    <input type="file" id="file-input" multiple
                           accept=".pdf,.docx,.xlsx,.md,.txt,.csv"
                           onchange="uploadFiles()">
                    <p>拖拽文件到此处<br>或点击上传</p>
                    <span class="hint">支持 PDF / Word / Excel / Markdown / TXT</span>
                </div>
                <div id="upload-status"></div>
            </div>

            <div class="sidebar-section">
                <h3>知识库状态</h3>
                <div id="kb-stats">
                    <p>文档块数: <span id="chunk-count">0</span></p>
                    <p>文档数: <span id="doc-count">0</span></p>
                </div>
            </div>

            <div class="sidebar-footer">
                <label class="toggle">
                    <input type="checkbox" id="rag-toggle" checked>
                    <span>RAG 模式</span>
                </label>
                <button class="btn btn-small btn-admin" id="btn-audit" style="display:none;"
                        onclick="openAuditPanel()">审计日志</button>
            </div>
        </aside>

        <!-- 主对话区 -->
        <main class="chat-area">
            <div class="chat-header">
                <h2>智能问答</h2>
                <span class="model-info" id="model-info">qwen2.5:7b</span>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="welcome-message">
                    <h3>企业智库</h3>
                    <p>上传文档到知识库，然后开始提问。</p>
                    <p>支持多轮对话，上下文自动关联。</p>
                </div>
            </div>

            <div class="chat-input-area">
                <textarea id="chat-input" placeholder="输入你的问题..." rows="1"
                          onkeydown="handleKeyDown(event)"></textarea>
                <button id="send-btn" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
        </main>
    </div>

    <!-- 登录遮罩 -->
    <div class="auth-overlay" id="auth-overlay">
        <div class="auth-card">
            <h2>企业智库</h2>
            <p class="auth-sub">私有化 RAG 知识问答系统</p>
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">登录</button>
            </div>
            <form id="login-form" onsubmit="event.preventDefault(); doLogin();">
                <input type="text" id="login-username" placeholder="用户名" autocomplete="username" required>
                <input type="password" id="login-password" placeholder="密码" autocomplete="current-password" required>
                <button type="submit" class="btn btn-primary btn-block">登 录</button>
            </form>
            <p class="auth-error" id="auth-error"></p>
            <p class="auth-hint">新用户由管理员创建账号<br>初始管理员密码见服务端 data/admin_credentials.txt</p>
        </div>
    </div>

    <!-- 审计日志面板 -->
    <div class="modal-overlay" id="audit-modal" style="display:none;" onclick="if(event.target===this)closeAuditPanel()">
        <div class="modal-card">
            <div class="modal-header">
                <h3>操作审计日志</h3>
                <button class="modal-close" onclick="closeAuditPanel()">&times;</button>
            </div>
            <div class="modal-filters">
                <input type="text" id="audit-user-filter" placeholder="按用户过滤" class="filter-input">
                <select id="audit-action-filter" class="filter-input">
                    <option value="">全部动作</option>
                    <option value="auth.login">登录</option>
                    <option value="auth.login_failed">登录失败</option>
                    <option value="auth.logout">登出</option>
                    <option value="auth.change_password">修改密码</option>
                    <option value="user.register">用户注册</option>
                    <option value="kb.create">创建知识库</option>
                    <option value="kb.delete">删除知识库</option>
                    <option value="document.upload">上传文档</option>
                    <option value="chat.completion">问答</option>
                    <option value="chat.stream">流式问答</option>
                    <option value="system.startup">系统启动</option>
                </select>
                <button class="btn btn-small" onclick="loadAudit(1)">查询</button>
            </div>
            <div class="modal-body">
                <table class="audit-table">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>用户</th>
                            <th>动作</th>
                            <th>对象</th>
                            <th>详情</th>
                        </tr>
                    </thead>
                    <tbody id="audit-tbody">
                        <tr><td colspan="5" class="audit-empty">加载中...</td></tr>
                    </tbody>
                </table>
                <div class="modal-pager">
                    <button class="btn btn-small" id="audit-prev" onclick="loadAudit(auditPage-1)">上一页</button>
                    <span id="audit-page-info"></span>
                    <button class="btn btn-small" id="audit-next" onclick="loadAudit(auditPage+1)">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
