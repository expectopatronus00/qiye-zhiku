<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业智库 - RAG 知识问答系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>企业智库</h1>
                <span class="version">v0.1</span>
            </div>

            <div class="sidebar-section">
                <h3>知识库</h3>
                <select id="collection-select" class="select-input">
                    <option value="default">默认知识库</option>
                </select>
                <button onclick="createCollection()" class="btn btn-small">+ 新建知识库</button>
            </div>

            <div class="sidebar-section">
                <h3>上传文档</h3>
                <div class="upload-area" id="upload-area">
                    <input type="file" id="file-input" multiple
                           accept=".pdf,.docx,.xlsx,.md,.txt,.csv"
                           onchange="uploadFiles()">
                    <p>拖拽文件到此处<br>或点击上传</p>
                    <span class="hint">支持 PDF / Word / Excel / Markdown / TXT</span>
                </div>
                <div id="upload-status"></div>
            </div>

            <div class="sidebar-section">
                <h3>知识库状态</h3>
                <div id="kb-stats">
                    <p>文档块数: <span id="chunk-count">0</span></p>
                    <p>文档数: <span id="doc-count">0</span></p>
                </div>
            </div>

            <div class="sidebar-footer">
                <label class="toggle">
                    <input type="checkbox" id="rag-toggle" checked>
                    <span>RAG 模式</span>
                </label>
            </div>
        </aside>

        <!-- 主对话区 -->
        <main class="chat-area">
            <div class="chat-header">
                <h2>智能问答</h2>
                <span class="model-info" id="model-info">qwen2.5:7b</span>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="message assistant">
                    <div class="message-content">
                        你好！我是企业智库问答助手。请先在左侧上传文档到知识库，然后就可以向我提问了。
                        我会基于知识库中的内容为你精准回答问题，并标注信息来源。
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <textarea id="chat-input" placeholder="输入你的问题..." rows="1"
                          onkeydown="handleKeyDown(event)"></textarea>
                <button id="send-btn" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
